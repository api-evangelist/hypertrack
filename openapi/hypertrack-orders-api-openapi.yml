          type:
          - integer
          - 'null'
          description: Time in seconds that the driver is expected to spend at the location when fulfilling the order
        product_type:
          type:
          - array
          - 'null'
          description: List of customer provided product/service types used when matching orders to a driver
          items:
            type: string
        type:
          type:
          - string
          - 'null'
          enum:
          - pick
          - drop
          description: Field to specify if the order is a pick/drop
        type_index:
          type:
          - integer
          - 'null'
          description: Field to specify if the order is a pick/drop
        capacity_used:
          type:
          - integer
          - 'null'
          description: Volumetric unit occupied by the order
        region:
          description: City, state, and country where the orders needs to be fulfilled
          anyOf:
          - $ref: '#/components/schemas/Region'
        distance:
          type:
          - integer
          - 'null'
          description: Total distance in meters travelled by the driver to reach the order location
        duration:
          type:
          - integer
          - 'null'
          description: Total time in seconds spent on the order.
        share_url:
          type:
          - string
          - 'null'
          description: Shareable URL for the consumer to track the live movement of the drive after the order is dispatched
        embed_url:
          type:
          - string
          - 'null'
          description: Embeddable URL for the ops team to view order timeline
        route_handle:
          type:
          - string
          - 'null'
          description: Unique identifier for the route
        plan_id:
          type:
          - string
          - 'null'
          description: Unique identifier of the plan
        planning_failure_reason:
          type:
          - string
          - 'null'
          description: Reason explaining why automated planning left the order unplanned. Present only when a planning attempt could not assign the order.
        track_mode:
          type:
          - string
          - 'null'
          enum:
          - on_time
          - flex
          - full_shift
          - on_shift
          - pre_shift
          description: Value representing whether the order is tracked in flex, on_time, on_shift, full_shift or pre_shift mode
        actual_service_time:
          type:
          - integer
          - 'null'
          description: Time in seconds that the driver is actually spent at the location when fulfilling the order
        tracked_service_time:
          type:
          - integer
          - 'null'
          description: Total time tracked in seconds for the driver at the location when fulfilling the order
        polyline:
          description: GeoJSON representation of polyline with the coordinates of the actual path travelled by the driver
          anyOf:
          - $ref: '#/components/schemas/Polyline'
        deviation_from_destination:
          type:
          - integer
          - 'null'
          description: Distance in meters between the actual completion location to the order location
        completed_at_destination:
          type:
          - boolean
          - 'null'
          description: Indicates whether the order was completed at destination
        cancelled_at_destination:
          type:
          - boolean
          - 'null'
          description: Indicates whether the order was cancelled at destination
        visited_destination:
          type:
          - boolean
          - 'null'
          description: Indicates whether the driver visited the destination
        tracking_rate:
          type:
          - number
          - 'null'
          description: Indicates the ratio of time tracked to expected tracking time of order. Values lie between 0.0 and 1.0
        start_location:
          description: Location where the driver started tracking to fulfill the order
          anyOf:
          - $ref: '#/components/schemas/PointLocationGeometryResponse'
        end_location:
          description: Location where the driver stopped tracking once the order was fulfilled or cancelled
          anyOf:
          - $ref: '#/components/schemas/PointLocationGeometryResponse'
        images:
          type:
          - array
          - 'null'
          description: List of URLs to be used to retrieve images associated with the order
          items:
            type: string
        order_score:
          type:
          - number
          - 'null'
          description: ''
        attachments:
          type:
          - array
          - 'null'
          description: Attachments for this order
          items:
            oneOf:
            - $ref: '#/components/schemas/ImageAttachment1'
            - $ref: '#/components/schemas/NoteAttachment1'
            - $ref: '#/components/schemas/SignatureAttachment1'
        previous_fulfillments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FulfillmentAttempt'
        parking:
          type:
          - array
          - 'null'
          description: Parkings associated with the order fulfillment
          items:
            $ref: '#/components/schemas/OrderParkingResponse'
        checkin:
          type:
          - array
          - 'null'
          description: Checkins associated with the order fulfillment
          items:
            $ref: '#/components/schemas/OrderCheckinResponse'
        service_area:
          type:
          - array
          - 'null'
          description: Service Areas associated with the order fulfillment
          items:
            $ref: '#/components/schemas/OrderServiceAreaResponse'
        time_to_first_event:
          type:
          - number
          - 'null'
          description: Time in seconds to receive first location after device's tracking is initiated for the route
        time_to_first_location:
          type:
          - number
          - 'null'
          description: Time in seconds to receive first event after device's tracking is initiated for the route
        timeline:
          type:
          - array
          - 'null'
          description: New Order timeline events sorted by event time
          items:
            oneOf:
            - $ref: '#/components/schemas/DriverActivityEvent'
            - $ref: '#/components/schemas/DriverOutageEvent'
            - $ref: '#/components/schemas/DriverStatusUpdatedEvent'
            - $ref: '#/components/schemas/OrderCreatedEvent'
            - $ref: '#/components/schemas/OrderAssignedEvent'
            - $ref: '#/components/schemas/OrderStartedEvent'
            - $ref: '#/components/schemas/OrderCompletedEvent'
            - $ref: '#/components/schemas/OrderCancelledEvent'
            - $ref: '#/components/schemas/OrderEnterExitEvent'
            - $ref: '#/components/schemas/OrderInferredEvent'
            - $ref: '#/components/schemas/OrderCustomEvent'
            - $ref: '#/components/schemas/OrderServiceEvent'
            - $ref: '#/components/schemas/DriverDeviceLinkedEvent'
            - $ref: '#/components/schemas/DriverDeviceUnlinkedEvent'
            - $ref: '#/components/schemas/DeviceDisconnectedEvent'
        worker_name:
          type:
          - string
          - 'null'
          description: Name of the worker to whom order is assigned.
        device_switch_mode:
          enum:
          - manual
          - login
          - closest_to_destination
          description: Mode with which order is expected to switch device
        place_handle:
          type:
          - string
          - 'null'
          description: Unique customer provided identifier of the place
        billing_details:
          description: Billing details for the order.
          anyOf:
          - $ref: '#/components/schemas/OrderBillingDetails'
        priority:
          enum:
          - low
          - medium
          - high
          description: Priority of the order
        tasks:
          type:
          - array
          - 'null'
          description: tasks associated with the order
          items:
            $ref: '#/components/schemas/OrderTaskResponse'
        metrics:
          description: Metrics associated with the order
          anyOf:
          - $ref: '#/components/schemas/OrderMetrics'
        timesheets:
          type:
          - array
          - 'null'
          description: Timesheet entries for the order. Includes HyperTrack-computed (HypertrackLocationTimesheet) and customer-provided entries.
          items:
            oneOf:
            - $ref: '#/components/schemas/HypertrackLocationTimesheet'
            - type: object
              additionalProperties: {}
        agent:
          description: Closeout copilot review data. Contains a `status` field (e.g. "approved") and a `timesheets` list of agent-collected or agent-reconciled entries. Null when closeout is not enabled or no review has taken place.
          anyOf:
          - $ref: '#/components/schemas/AgentReview'
      required:
      - disabled_at
      - order_handle
      - status
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    TokenAuth:
      type: http
      scheme: bearer
    BearerAuth:
      type: http
      scheme: bearer
