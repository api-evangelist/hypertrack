    get:
      parameters:
      - in: path
        name: order_handle
        schema:
          type: string
        required: true
      - in: query
        name: value
        description: String representation to fetch webhooks for. It can be comma separated list, each itemin list can be one of `assigned`, `started`, `first_eta`, `eta`, `eta_change`, `n_minutes_away`, `device_switched`, `disabled`, `enabled`, `updated`, `delayed`, `risk_updated`, `arrived`, `exited`, `completed`, `cancelled`. eg. `?value=eta,eta_change
        schema:
          type:
          - string
          - 'null'
        required: false
