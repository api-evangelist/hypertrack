    BatchOrdersRequest:
      type: object
      properties:
        ops_group_handle:
          type:
          - string
          - 'null'
          description: Unique Handle of Ops Group to plan orders for
        orders:
          type: array
          minItems: 1
          description: List of Orders which are to be planned
          items:
            $ref: '#/components/schemas/OrderRequest'
        plan_mode:
          type: string
          enum:
          - on_demand
          - scheduled
          - manual
          description: "- `scheduled` mode allows customers to batch and sequence future orders into routes for worker based on their availability. This mode operates only on the upcoming routes (if exist), but does not re-plan ongoing routes.\n- `manual` mode allows customers to ingest orders into HT which are to be planned manually.<ul> <li> If `worker_handle` is provided, hypertrack will create a new route for the specified worker with the posted orders in the provided sequence.</li> <li> In case `worker_handle` is not given, then hypertrack will ingest orders into system to facilitate further planning.</li></ul> \n- `on_demand` mode is to facilitate the use case where an order needs to be planned on top of an existing plan, here <ul><li> if `worker_handle` is provided, then the order will be assigned to that worker, either optimally adjusted into his/her existing route (if present) OR a new route is created for the worker.</li> <li> If `worker_handle` is not provided, then the order either gets adjusted to one of the available worker's route in the most optimal manner OR is added to a new route. In both scenarios, order planning makes sure Order SLAs are met. On demand mode works for future as well as live routes.</li></ul>"
        driver_handle:
          type:
          - string
          - 'null'
          description: Driver handle to which order will be assigned to.
          deprecated: true
        worker_handle:
          type:
          - string
          - 'null'
          description: Worker handle to which order will be assigned to.
        enable_sync_planning:
          type:
          - boolean
          - 'null'
          default: false
          description: Flag to enable synchronous planning when the plan mode is on_demand. For scheduled mode, planning is always performed asynchronously.
        route_solver_matrix_strategy:
          default: osrm_full
          enum:
          - osrm_full
          - als_full
          - hybrid_sparse
          description: 'Strategy to use for route solver. Options: osrm_full, als_full, hybrid_sparse'
      required:
      - orders
      - plan_mode
