    TrackOrdersRequest:
      type: object
      properties:
        route_handle:
          type:
          - string
          - 'null'
          description: Unique Handle of route to be tracked. if provided other parameters are not required and will be ignored if provided
        driver_handle:
          type:
          - string
          - 'null'
          description: One of device_id or driver handle is mandatory
          deprecated: true
        worker_handle:
          type:
          - string
          - 'null'
          description: One of device_id or worker handle is mandatory
        ops_group_handle:
          type:
          - string
          - 'null'
          description: Unique Handle of Ops Group for which orders are to be tracked
        device_id:
          type:
          - string
          - 'null'
          description: One of device_id or driver handle is mandatory
        orders:
          type:
          - array
          - 'null'
          description: List of Orders which are to be tracked. Required if route handle is not provided, i.e. new route will be created
          items:
            $ref: '#/components/schemas/TrackOrder'
        track_mode:
          enum:
          - full_shift
          - pre_shift
          - on_shift
          - on_time
          - flex
          description: Tracking mode of the order. Note that `on_time` and `flex` are deprecated modes.
        route:
          description: Route that will be created to contain the orders to be tracked
          anyOf:
          - $ref: '#/components/schemas/TrackOrderRoute'
        version:
          type:
          - integer
          - 'null'
          description: Route version.
        agent_mode:
          enum:
          - standalone
          - tracked
          - false
          description: '[BETA] Agent reconciliation mode. ''standalone'' runs reconciliation based on data provided without HyperTrack tracking. ''tracked'' enables normal HyperTrack tracking and forwards order data to Closeout Copilot asynchronously for reconciliation.'
        closeout_mode:
          enum:
          - standalone
          - tracked
          - false
          writeOnly: true
          description: '[BETA] Deprecated alias for agent_mode. Use agent_mode instead.'
        worker_phone_number:
          type:
          - string
          - 'null'
          description: '[BETA] Worker phone number for closeout reconciliation. Only used when closeout_mode is ''standalone''.'
        device_switch_mode:
          default: login
          enum:
          - manual
          - login
          - closest_to_destination
          description: "Mode to control the active device for tracking orders. The following options are available: \n - `login` : Order tracking is based on the device the worker last logged into. When the worker logs into a new device, the orders automatically transfer to the new device. This is the default setting.\n- `closest_to_destination` : Order tracking is based on the device closest to the order's destination. The system monitors all of the worker's recent devices and selects the one nearest to the destination for tracking the order.\n- `manual` : Order tracking remains on the device that was active when the order was created."
      required:
      - track_mode
