    get:
      parameters:
      - in: query
        name: completed_at_date
        description: Filter for routes completed on specified date (YYYY-MM-DD)
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: completed_at_from
        description: Filter for routes completed after specified timestamp (YYYY-MM-DD HH:mm:ss)
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: completed_at_to
        description: Filter for routes completed before specified timestamp (YYYY-MM-DD HH:mm:ss)
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: created_at_date
        description: Filter for routes created on specified date (YYYY-MM-DD)
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: created_at_from
        description: Filter for routes created after specified timestamp (YYYY-MM-DD HH:mm:ss)
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: created_at_to
        description: Filter for routes created before specified timestamp (YYYY-MM-DD HH:mm:ss)
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: worker_handle
        description: Unique customer provided identifier of the worker to used retrieve routes associated with the specified worker
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: driver_handle
        description: Unique customer provided identifier of the driver to used retrieve routes associated with the specified driver
        schema:
          type:
          - string
          - 'null'
          deprecated: true
        required: false
      - in: query
        name: ops_group_handle
        description: Filter for routes on specified ops group handle or list of comma separated handles
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: plan_mode
        description: Filter for routes on specified plan mode (`manual` -> routes created manually, `scheduled` -> routes created automatically)
        schema:
          type:
          - string
          - 'null'
          enum:
          - on_demand
          - scheduled
          - manual
        required: false
      - in: query
        name: planned_at_date
        description: Filter for routes planned on specified date (YYYY-MM-DD).
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: planned_at_from
        description: Filter for routes planned after specified timestamp (YYYY-MM-DD HH:mm:ss)
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: planned_at_to
        description: Filter for routes planned before specified timestamp (YYYY-MM-DD HH:mm:ss)
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: region_filter
        description: JSON object containing `city`, `state`, or `country` used to filter routes
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: route_metadata_filter
        description: JSON object representing route metadata to be used to filter routes
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: sort_direction
        description: Sort route responses by `asc` or `desc` on the created_at timestamp
        schema:
          type:
          - string
          - 'null'
          enum:
          - asc
          - desc
        required: false
      - in: query
        name: start_by_date
        description: Date (YYYY-MM-DD) used as a filter to retrieve routes that need to start by the given date
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: start_by_from
        description: Timestamp (YYYY-MM-DD HH:mm:ss) of the start of window to retrieve routes that need to start within a timeframe
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: start_by_to
        description: Timestamp (YYYY-MM-DD HH:mm:ss) of the end of window to retrieve routes that need to start within a timeframe
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: started_at_date
        description: Date (YYYY-MM-DD) used as a filter to retrieve routes that started on a given date
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: started_at_from
        description: Timestamp (YYYY-MM-DD HH:mm:ss) of the start of window to retrieve routes that started within a timeframe
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: started_at_to
        description: Timestamp (YYYY-MM-DD HH:mm:ss) of the end of window to retrieve routes that started within a timeframe
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: scheduled_start_at_from
        description: Timestamp (YYYY-MM-DD HH:mm:ss) of the start of window to retrieve routes that scheduled start within a timeframe
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
