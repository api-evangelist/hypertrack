    PostOpsGroupRequest:
      type: object
      properties:
        ops_group_handle:
          type: string
          description: Unique identifier for an Ops Group
        ops_group_label:
          type: string
          description: Display name for an Ops Group
        route_start_location:
          type: string
          default: live_location
          enum:
          - driver_home
          - ops_group_home
          - live_location
          description: Configuration to identify where routes are expected to start
        route_completion_type:
          type: string
          default: end_at_last_order
          enum:
          - end_at_last_order
          - return_to_start_location
          - manual
          description: Configuration to identify where routes are expected to end
        objective_fn:
          type:
          - string
          - 'null'
          default: minimise_time
          enum:
          - minimise_time
          - minimise_distance
          description: Configuration to identify the metric used by the solver when generating optimized routes
        order_tracking_mode:
          type:
          - string
          - 'null'
          description: Order tracking mode associated with the ops-group
          deprecated: true
        order_tracking_automation:
          description: 'Controls how and when worker tracking is automatically started and stopped. If `null`, the default behavior is equivalent to: `{"type": "manual"}`.'
          anyOf:
          - $ref: '#/components/schemas/OpsGroupOrderTrackingAutomation'
        work_status_automation:
          type:
          - array
          - 'null'
          description: 'List of configuration object to enable/disable and customize automatic work status updation. If `null`, the default behavior is equivalent to: `{"type": "manual"}`.'
          items:
            $ref: '#/components/schemas/WorkStatusAutomation'
        ops_group_home:
          description: Location of the Ops Group
          anyOf:
          - $ref: '#/components/schemas/OpsGroupHomeRequest'
        default_shift_start_time:
          type:
          - string
          - 'null'
          description: Default time HH:mm when the shift starts for drivers
        default_shift_end_time:
          type:
          - string
          - 'null'
          description: Default time HH:mm when the shift ends for drivers
        route_capacity:
          type:
          - integer
          - 'null'
          description: Maximum number of orders in a route
        route_max_distance:
          type:
          - integer
          - 'null'
          description: Maximum distance in meters used by the route solver to constrain each route distance
        operations_radius:
          type:
          - integer
          - 'null'
          description: Maximum distance in meters from the ops group home within which order destinations are allowed
        enforce_operations_radius:
          type:
          - boolean
