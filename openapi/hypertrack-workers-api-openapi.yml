    OpsGroupOrderTrackingAutomation:
      type: object
      properties:
        mode:
          type:
          - string
          - 'null'
          enum:
          - auto
          - auto_start
          - auto_stop
          description: "Controls what automation should occur.\n            <ul>\n                <li>`\"auto\"`: Automatically start <em>and</em> stop tracking based on the `type`.</li>\n                <li>`\"auto_start\"`: Only automatically <em>start</em> tracking.</li>\n                <li>`\"auto_stop\"`: Only automatically <em>stop</em> tracking.</li>\n            </ul>\n            "
        lead_time:
          type:
          - integer
          - 'null'
          default: 0
          minimum: 0
          maximum: 86399
          description: "Defines how <em>early</em> tracking should begin, relative to a key event.\n            <ul>\n                <li>If `type` is `\"shift\"`: Starts `lead_time` seconds <em>before</em> the driver's schedule `start_time`.</li>\n                <li>If `type` is `\"order\"`: Starts `lead_time` seconds <em>before</em> the driver's <strong>first</strong> assigned order's `scheduled_at` time.</li>\n                <li>If `type` is `\"route\"` or `\"order_and_route\"`: Starts `lead_time` seconds <em>before</em> the driver's assigned route's `scheduled_start_at` time.</li>\n            </ul>\n            "
        lag_time:
          type:
          - integer
          - 'null'
          default: 0
          minimum: 0
          maximum: 86399
          description: "Defines how <em>late</em> tracking should stop, relative to a key event.\n            <ul>\n                <li>If `type` is `\"shift\"`: Stops `lag_time` seconds <em>after</em> the driver's schedule `end_time`.</li>\n                <li>If `type` is `\"order\"`: Stops `lag_time` seconds <em>after</em> the driver's <strong>last</strong> order is completed.</li>\n            </ul>\n            <strong>Important:</strong> Tracking will <em>not</em> automatically stop if the driver still has active orders.\n            "
        type:
          type: string
          enum:
          - manual
          - shift
          - order
          - route
          - order_and_route
          description: "Defines the basis for automation. The value of this field determines how the rest of the configuration is interpreted.\n            <ul>\n                <li>`\"manual\"`: No automation. Tracking must be manually started and stopped. All other fields are ignored.</li>\n                <li>`\"shift\"`: Automation is based on the driver's scheduled shift times.</li>\n                <li>`\"order\"`: Automation is based on the driver's assigned order times.</li>\n                <li>`\"route\"`: Automation is based on the driver's assigned route scheduled start times.</li>\n                <li>`\"order_and_route\"`: Automation is based on the driver's assigned order and route scheduled start times.</li>\n            </ul>\n            "
        approval:
          description: Approval automation settings.
          anyOf:
          - $ref: '#/components/schemas/ApprovalAutomation'
        acceptance:
          description: Acceptance automation settings.
          anyOf:
          - $ref: '#/components/schemas/AcceptanceAutomation'
      required:
      - type
