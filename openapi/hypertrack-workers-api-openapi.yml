components:
  schemas:
    DriverOutageSummary:
      type: object
      properties:
        code:
          type: string
          description: Code indicating the type of outage
        label:
          type: string
          description: Text indicating the type of outage
        description:
          type: string
          description: Text describing the outage.
        category:
          type: string
          enum:
          - behavioural
          - adversarial
          - reachability
          - os
          - sporadic
          description: String indicating the category of outage
        duration:
          type: integer
          description: Sum total duration of all outages experienced with this `code` in the specified time range.
        distance:
          type: integer
          description: Sum total (estimated) distance covered during all outages experienced with this `code` in the specified time range.
      required:
      - category
      - code
      - description
      - distance
      - duration
      - label
    GetWorkerHistoryResponse:
      type: object
      properties:
        worker_handle:
          type: string
          description: Unique customer provided identifier for a worker
        locations:
          description: List of locations for the worker's device
          allOf:
          - $ref: '#/components/schemas/LineStringLocation1'
        markers:
          type: array
          description: List of markers summarising the history of the worker
          items:
            type: object
            additionalProperties: {}
        started_at:
          type: string
          description: Time from where the history is requested from
        completed_at:
          type: string
          description: Time to where the history is requested to
        distance:
          type: integer
          description: Distance tracked during the duration of history
        duration:
          type: integer
          description: Duration tracked during the duration of history
        steps:
          type: integer
          description: Number of steps taken by worker during the duration of history
      required:
      - completed_at
      - distance
      - duration
      - locations
      - markers
      - started_at
      - steps
      - worker_handle
    PatchWorkerRequest:
      type: object
      properties:
        device_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique ID representing the worker's device
        name:
          type:
          - string
          - 'null'
          description: Name of the worker
        ops_group_handle:
          type:
          - string
          - 'null'
          description: Unique identifier for an Ops Group to which the worker belongs
        home:
          description: Worker's home location
          anyOf:
          - $ref: '#/components/schemas/LocationWithoutRadius1'
        product_types:
          type:
          - array
          - 'null'
          description: List of product types used for worker matching during order planning
          items:
            type: string
        schedule:
          type:
          - array
          - 'null'
          description: List of schedules used for worker matching during order planning and auto start/stop of availability or tracking of the worker
          items:
            oneOf:
            - $ref: '#/components/schemas/DriverDateSchedule'
            - $ref: '#/components/schemas/DriverRecurringSchedule'
        profile:
          type:
          - object
          - 'null'
          description: Additional customer provided data associated with a worker
          additionalProperties: {}
        unavailable_on:
          type:
          - array
          - 'null'
          description: List of dates (YYYY-MM-DD) on which the worker is unavailable
          items:
            type: string
        transfer_existing_work:
          type:
          - boolean
          - 'null'
          default: true
          description: Flag to indicate whether existing work of the worker is to be transferred to the newly linked device.Only applicable at the time of linking worker with a device.
    SetWorkerStatusResponse:
      type: object
      properties:
        worker_handle:
          type: string
          description: Unique customer provided identifier for a worker
        name:
          type:
          - string
          - 'null'
          description: Name of the worker
        ops_group_handle:
          type: string
          description: Unique identifier for an Ops Group to which the worker belongs
        product_types:
          type: array
          description: List of product types used for worker matching during order planning
          items:
            type: string
        device_id:
          type:
          - string
          - 'null'
          description: Unique ID representing the worker's device
        profile:
          type: object
          description: Metadata associated with a worker
          additionalProperties: {}
        work_status:
          description: work_status of the worker with respect to availability and on order fulfilment
          allOf:
          - $ref: '#/components/schemas/DriverStatus1'
        schedule:
          type:
          - array
          - 'null'
          description: List indicating the schedule of a worker for work assignment
          items:
            oneOf:
            - $ref: '#/components/schemas/DriverDateSchedule'
            - $ref: '#/components/schemas/DriverRecurringSchedule'
        deleted:
          type:
          - boolean
          - 'null'
          description: Flag indicating whether the worker was deleted
        created_at:
          type: string
          description: Timestamp at which the worker was created
        home:
          description: Worker home
          allOf:
          - $ref: '#/components/schemas/LocationWithoutRadiusResponse'
        deleted_at:
          type:
          - string
          - 'null'
          description: Timestamp at which the worker was deleted
        location:
          description: Last known location of the worker.
          anyOf:
          - $ref: '#/components/schemas/MovementLocationResponse'
        device_status:
          description: Current status of the device used by the worker
          anyOf:
          - $ref: '#/components/schemas/DeviceStatus1'
        unavailable_on:
          type: array
          description: List of dates (YYYY-MM-DD) on which the worker is not available
          items:
            type: string
        summary:
          description: Summary of work done by the worker during the specified time range. Default last 24 hours.
