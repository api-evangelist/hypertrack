          description: 'ISO 8601 date format (''yyyy-MM-dd'') indicating the end date to be used for the summary computation.<br>Default: Current date in UTC.'
        limit:
          type:
          - integer
          - 'null'
          default: 25
          description: Number of workers to be sent in response
        include_schedule:
          type: boolean
          default: true
          description: Flag to include worker's schedule in the response.
        include_summary:
          type: boolean
          default: true
          description: Flag to include worker's summary stats in the response.
        ops_group_handle:
          type:
          - string
          - 'null'
          description: List of ops group handles as comma separated strings used to filter workers.
        profile:
          type:
          - string
          - 'null'
          description: Profile filter to be applied on the list of workers
        worker_handle:
          type:
          - string
          - 'null'
          description: List of worker handles as comma separated strings used for fetching associated workers
        search_term:
          type:
          - string
          - 'null'
          description: Keyword to match against worker handle, name, or profile
        pagination_token:
          type:
          - string
          - 'null'
          description: Identifier used to fetch the next page of data
        device_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier for a worker's device. This field is present in case the worker is currently linked with a device
        include_deleted:
          type: boolean
          default: false
          description: Flag to include deleted workers
        from_time:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO 8601 datetime indicating the start time to be used for computing summary, status.
          deprecated: true
        to_time:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO 8601 datetime indicating the end time to be used for computing summary, status.
          deprecated: true
        filter_outage:
          type:
          - string
          - 'null'
          description: Filter workers on a particular outage code.
        filter_outage_category:
          type:
          - string
          - 'null'
          description: 'List of comma separated outage categories to be used for filtering workers. Valid categories: `behavioural`,`adversarial`,`reachability`,`os`,`sporadic`'
        filter_geofence_metadata:
          type:
          - string
          - 'null'
          description: geofence_metadata filter for aggregate response
        aggregate:
          type: boolean
          default: false
          description: Flag set to retrieve aggregated data over the provided time range
        work_status:
          type:
          - string
          - 'null'
          description: URL-encoded json string specifying filters on availability or tracking.
        filter_status:
          type:
          - string
          - 'null'
          enum:
          - active
          - inactive
          - disconnected
          description: Only list workers that are currently active/inactive/disconnected.
        tracked:
          type:
          - boolean
          - 'null'
          description: If set to true, only shows workers that were actually tracked during the specified period.
        worked:
          type:
          - boolean
          - 'null'
          description: If set to true, only shows workers that actually during the specified period.
        intended_to_track:
          type:
          - boolean
          - 'null'
          description: If set to true, only shows workers that was supposed to be tracked during the specified period.
        include_lp:
          type:
          - boolean
          - 'null'
          default: false
          description: Flag to include location permission stats in response (only applicable when `aggregate=True`).
        region_filter:
          type:
          - string
          - 'null'
          description: URL-encoded JSON string used to filter workers from a particular region. Ex `{"city":"Detroit"}`
        email_recipients:
          type: array
          description: Optional list of email addresses to send the export download link. Falls back to the account email when omitted.
          items:
            type: string
    LocateResponse:
      type: object
      properties:
        request_id:
          type: string
          description: Unique identifier for the locate request.
        worker_handle:
          type: string
          description: Unique customer provided identifier for a worker.
        status:
          type: string
          enum:
          - pending
          - completed
          - error
          description: 'Worker-level rollup: `pending` while async work is in flight, `completed` once the async work is done (introspect `devices[]` for per-device outcomes — connection state lives on `device_status`, outage detail on `outage_reasons`), `error` on unexpected internal failure.'
        devices:
          type:
          - array
          - 'null'
          description: Per-device locate results, newest session first. Empty array when the worker has no active device sessions; see each entry's `outage_reasons` for per-device outages.
          items:
            $ref: '#/components/schemas/LocateDeviceResultResponse'
        created_at:
          type:
          - string
          - 'null'
          description: Timestamp at which the locate request was created.
        updated_at:
          type:
          - string
          - 'null'
          description: Timestamp of last update to the locate request.
        completed_at:
          type:
          - string
          - 'null'
          description: Timestamp at which the locate request reached a terminal state.
      required:
      - request_id
      - status
      - worker_handle
    OrderStats:
      type: object
      properties:
        mean:
          type:
          - number
          - 'null'
          description: Average value for the metric
        min:
          type:
          - number
          - 'null'
          description: Minimum value for the metric
        max:
          type:
          - number
          - 'null'
          description: Maximum value for the metric
        stdev:
          type:
          - number
          - 'null'
          description: Standard deviation for the metric
        mean_by_driver:
          type:
          - number
          - 'null'
          description: Average value per worker for the metric
        sum:
          type: number
          description: Total value of the metric
      required:
      - sum
    UndeleteWorkerResponse:
      type: object
