    WorkStatusAutomation:
      type: object
      properties:
        mode:
          type:
          - string
          - 'null'
          enum:
          - auto
          - auto_start
          - auto_stop
          description: "Controls what automation should occur.\n                <ul>\n                    <li>`\"auto\"`: Automatically toggle <em>and</em> work status based on the `type`.</li>\n                    <li>`\"auto_start\"`: Only automatically set <em>start</em> work status based on the `type`.</li>\n                    <li>`\"auto_stop\"`: Only automatically reset <em>stop</em> work status based on the `type`.</li>\n                </ul>\n                "
        type:
          type: string
          enum:
          - manual
          - tracking
          - available
          description: "Defines the basis for automation. The value of this field determines how the rest of the configuration is interpreted.\n                <ul>\n                    <li>`\"manual\"`: No Automation. Work status to be managed manually.</li>\n                    <li>`\"tracking\"`: Automate tracking controls based on worker/ops-group schedule.</li>\n                    <li>`\"available\"`: Automate availability controls based on worker/ops-group schedule.</li>\n                </ul>\n                "
      required:
      - type
