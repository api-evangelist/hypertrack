    The contract declares info.version "1.0" while the API it describes is v3 (in the hostname).
    Flag the discrepancy without altering the published value.
  update:
    x-version-note: >-
      info.version is "1.0" but the API major version lives in the host
      (https://v3.api.hypertrack.com). Do not read info.version as the API version.
- target: $.paths
  description: >-
    Record the missing-operationId finding at the document level. 83 of 85 operations declare no
    operationId, so tools, SDK generators and MCP bindings have no stable handle to bind to. No
    operationIds are invented here — synthesising them would create identifiers the provider does
    not recognise.
  update:
    x-operation-id-coverage:
      total_operations: 85
      with_operation_id: 2
      with_operation_id_list: [postOauthToken, postOauthEmbedToken]
      finding: >-
        Every non-auth operation must be addressed by method + path. Code generation from this
        contract will produce machine-derived method names that will not match HyperTrack's own
        naming.
- target: $.components.securitySchemes
  description: >-
    The contract declares three http schemes but no oauth2 scheme, even though POST /oauth/token
    implements a real client_credentials grant. Record the true auth model alongside the declared
    one.
  update:
    x-actual-auth-model:
      primary: 'HTTP Basic — base64(AccountID:SecretKey)'
      oauth2_grant: client_credentials via POST /oauth/token
      oauth2_declared_as_scheme: false
      scopes_published: false
      mobile_credential: Publishable Key (SDK only, not the SecretKey)
      see: authentication/hypertrack-authentication.yml
