standards:
- id: openapi
  conforms: true
  version: 3.0.3
  evidence: >-
    openapi/hypertrack-openapi.yaml — provider-published at
    https://hypertrack.com/reference/openapi.yaml and indexed from the docs llms.txt. 64 paths,
    85 operations, 395 component schemas.
- id: oauth2
  conforms: true
  evidence: >-
    POST /oauth/token implements the OAuth 2.0 client_credentials grant with
    application/x-www-form-urlencoded body (grant_type, client_id, client_secret, optional scope)
    returning access_token / token_type / expires_in. Note the securitySchemes block declares the
    result only as http/bearer (TokenAuth, BearerAuth), not as an oauth2 scheme with flows — so the
    grant is real but the contract does not machine-declare it.
- id: oauth2-scopes
  conforms: false
  evidence: >-
    The token endpoint accepts an optional space-delimited `scope` parameter, but no scope names are
    published anywhere and no securityScheme declares scopes. No scopes/ artifact is written.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on every host (well-known/hypertrack-well-known.yml).
- id: rfc9457
  conforms: false
  evidence: >-
    Errors are vendor JSON in three different shapes (Error, ValidationError, HTTPError); no
    application/problem+json media type appears anywhere in the contract.
- id: rfc9116
  conforms: false
  evidence: /.well-known/security.txt returns 404 on hypertrack.com and v3.api.hypertrack.com.
- id: rfc8594
  conforms: false
  evidence: No Sunset or Deprecation header is documented; no operation is marked deprecated.
- id: pagination
  conforms: true
  style: cursor
  evidence: >-
    `limit` + opaque `pagination_token` on collection operations (16 and 15 operations
    respectively). Consistent across Orders, Workers, Places, Visits and Geotags.
- id: idempotency
  conforms: partial
  evidence: >-
    No Idempotency-Key header. Creates are natural-key idempotent via caller-supplied handles and
    return 409 `duplicate_resource` on repeat; action endpoints have no replay protection. See
    conventions/hypertrack-conventions.yml.
- id: rate-limit-headers
  conforms: false
  evidence: >-
    No RateLimit-*/X-RateLimit-*/Retry-After headers documented or observed; no 429 declared in the
    contract. See rate-limits/hypertrack-rate-limits.yml.
- id: webhooks
  conforms: true
  evidence: >-
    14 event types with 22 order-event values and a documented envelope, signature header
