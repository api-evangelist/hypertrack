domain_standards:
- id: geojson
  name: GeoJSON (RFC 7946)
  conforms: true
  evidence: >-
    The contract models all geometry as GeoJSON rather than as bespoke lat/lng pairs.
    components.schemas.PointGeometry declares type enum ["Point"] with coordinates as
    [longitude, latitude]; PolygonGeometry declares type enum ["Polygon"] with the RFC 7946 nested
    ring array; order destinations are a oneOf over the two. Route responses are described as
    "the route polyline as a GeoJSON LineString". Webhook payloads carry the same shape
    ("location": {"type": "Point", "coordinates": [...]}). This is the domain standard for the
    geospatial market: a consumer that already speaks GeoJSON — PostGIS, Leaflet, Mapbox,
    MapLibre, Turf, ArcGIS — reads HyperTrack geometry with no bespoke connector.
  spec_locations:
  - components.schemas.PointGeometry
  - components.schemas.PolygonGeometry
  - components.schemas.LocationGeometryResponse
  - GET /orders/estimated-routes/{estimated_route_id} (description)
- id: iso8601
  name: ISO 8601 timestamps
  conforms: true
  evidence: >-
    created_at / recorded_at / scheduled_at are ISO 8601 UTC throughout the REST contract and the
    webhook envelope; the webhooks reference states the format explicitly.
- id: gpx
  name: GPS Exchange Format
  conforms: partial
  evidence: >-
    Not a payload format. GPX is the format HyperTrack's own testing guide
    (https://hypertrack.com/docs/mock-location) tells iOS developers to use to drive simulated
    location in XCTest. Recorded because it is a real, published interop point, not because the API
    accepts GPX.
- id: ogc-api-features
  conforms: false
  evidence: >-
    No OGC API - Features surface, no /collections, no landing page or conformance declaration. The
    geospatial standard HyperTrack adopts is the payload format (GeoJSON), not the OGC service
    interface.
compliance:
