device_outage_codes:
  source: https://github.com/hypertrack/hypertrack-skills (skills/hypertrack-integration/references/troubleshooting.md)
  note: >-
    Not API errors. These are the reasons HyperTrack reports when a tracked device stops producing
    location, surfaced on the order timeline and on device_status webhooks. The full enumerated list
    of `device_status.data.reason` values is in
    asyncapi/hypertrack-events-webhooks.yml.
  categories:
  - name: Behavioral
    examples: [location permissions denied or revoked, app deleted or uninstalled, location services turned off]
  - name: Adversarial
    examples: [location mocking detected, time offset manipulation]
  - name: Operating System
    examples: [app terminated on low memory, system reboot, OS update, excessive resource usage]
  - name: Sporadic
    examples: [low battery, battery saver active, GPS unavailable]
  - name: Reachability
    examples: [no internet connectivity, push notification token missing or invalid]
