mcp_only:
- tool: list_devices
  reason: >-
    The published OpenAPI has no /devices resource. Devices appear only as fields on workers and on
    the webhook payloads.
- tool: get_device
  reason: No device resource in the published OpenAPI.
- tool: get_device_history
  reason: >-
    No device resource in the published OpenAPI. The nearest REST analog is
    GET /workers/{worker_handle}/history, but that is keyed on the worker, not the device, and the
    docs do not state that the tool is backed by it.
- tool: list_geofences
  reason: >-
    No /geofences resource in the published OpenAPI. Geofences are configured on places
    (/places/v1/) and surface as geofence webhook markers; there is no public REST list operation.
- tool: get_geofence
  reason: No /geofences resource in the published OpenAPI.
- tool: get_account_usage
  reason: >-
    No usage or billing resource in the published OpenAPI. Account usage is otherwise visible only
    in the dashboard.
rest_only_note: >-
  70 of the 85 REST operations have no MCP tool. That is by design and the provider says so: every
  MCP tool is read-only, so the entire write surface is REST-only. The classes with no tool coverage
  are listed below rather than enumerated one operation at a time.
rest_only_classes:
- class: Authentication
  operations: ['POST /oauth/token', 'POST /oauth/embed-token']
- class: Order writes
  note: >-
    create/batch, track, update, cancel, complete, reassign, reschedule, enable, disable, custom
    events, tasks CRUD, task definitions CRUD, plan trigger, export jobs
- class: Route writes
  note: create, update, add order, remove order, resequence, optimise, complete, reassign
- class: Worker writes
  note: create, patch, delete, undelete, invite, locate, work status, approvers CRUD, export jobs
- class: Place writes
  note: create, update, delete, suggestions create/apply, clear inferences
- class: Visit writes
  note: patch visit, add attachment, delete attachment
- class: Nearby search
  operations: ['POST /nearby/v4', 'POST /nearby/v3', 'GET /nearby/v4']
- class: Ops groups
  note: list, create, get, update
- class: Public tracking view
  operations: ['GET /tracking/{tracking_id}']
