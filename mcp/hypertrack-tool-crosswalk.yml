source: mcp/hypertrack-mcp.yml + openapi/hypertrack-openapi.yaml
note: >-
  The HyperTrack OpenAPI declares an operationId on only 2 of its 85 operations (postOauthToken and
  postOauthEmbedToken). Every other operation is addressed here by METHOD + PATH, which is the only
  stable identifier the contract offers. That is itself the finding: an agent binding a tool to a
  REST operation has no operationId to bind to. Confidence is `medium` throughout the mapped rows
  because the live MCP tool schemas could not be introspected without a customer's credentials, so
  each binding is by name and documented semantics rather than by a compared inputSchema.
surfaces:
  openapi:
    file: openapi/hypertrack-openapi.yaml
    server: https://v3.api.hypertrack.com
    operations: 85
    gated: false
  graphql: null
  mcp:
    mode: local-stdio
    package: '@hypertrack/mcp-server'
    endpoint: null
    gated: true
    gated_reason: >-
      No anonymous endpoint exists; tools/list requires running the npm package locally with a
      customer's HYPERTRACK_ACCOUNT_ID and HYPERTRACK_SECRET_KEY.
