generated: '2026-08-22'
method: searched
source: https://hypertrack.com/docs/mcp-server
name: HyperTrack MCP Server
status: published
vendor_version: 0.1.60
protocol: Model Context Protocol
deployment:
  mode: local-stdio
  endpoint: null
  install: npx -y @hypertrack/mcp-server
  package: https://www.npmjs.com/package/@hypertrack/mcp-server
  auth: api-key
  verified: searched
deployment_note: >-
  There is NO hosted remote endpoint. The server is an npm package a human installs and runs
  locally over stdio, authenticated with the account's own HYPERTRACK_ACCOUNT_ID and
  HYPERTRACK_SECRET_KEY environment variables. HyperTrack also ships a Streamable HTTP entry point
  in the same package (`npx -y --package @hypertrack/mcp-server hypertrack-mcp-http`), but it binds
  to 127.0.0.1:3000 by default, carries no authentication of its own, and is explicitly documented
  as something the customer self-hosts — it is not a HyperTrack-operated agent surface, so `mode`
  stays local-stdio.
clients_documented:
- Claude Desktop
- Claude Code
- Cursor
- VS Code
requirements:
  runtime: Node.js 18 or later
  credentials:
  - HYPERTRACK_ACCOUNT_ID
  - HYPERTRACK_SECRET_KEY
configuration:
- name: HYPERTRACK_ACCOUNT_ID
  required: true
- name: HYPERTRACK_SECRET_KEY
  required: true
- name: HYPERTRACK_API_BASE_URL
  required: false
- name: PORT
  required: false
- name: HOST
  required: false
- name: CORS_ORIGIN
  required: false
safety:
  write_capable: false
  note: >-
    Every tool is read-only by design. HyperTrack states the server "cannot create, update, or
    delete anything" and that read-only access is the backstop against prompt injection: a
    successful injection can read account data but cannot cancel an order or reassign a worker.
    The SecretKey still grants read access to the entire account, including worker locations and
    customer addresses.
tools_source: https://hypertrack.com/docs/mcp-server#available-tools
tools_note: >-
  Tool names and descriptions are taken verbatim from the provider's published tool table. Input
  schemas were NOT captured — the server has no anonymous endpoint to run tools/list against, so
  schemas require authenticated local introspection with a customer's own credentials.
