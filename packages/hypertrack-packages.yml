source: >-
  Registry metadata endpoints (registry.npmjs.org, pub.dev, trunk.cocoapods.org, NuGet search),
  GitHub releases for github.com/hypertrack/*, and the HyperTrack install docs at
  https://hypertrack.com/docs/install-sdk
note: >-
  HyperTrack's Android SDK is NOT published to Maven Central — it is served from the company's own
  Maven repository at https://s3-us-west-2.amazonaws.com/m2.hypertrack.com/, which does not expose a
  browsable maven-metadata.xml for com/hypertrack/sdk-android (probed 2026-08-22, HTTP 404
  NoSuchKey). Versions for the Android and iOS SDKs are read from the first-party GitHub release
  tags instead, and that is recorded per entry.
