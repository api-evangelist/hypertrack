aid: hypertrack
name: HyperTrack
description: >-
  HyperTrack is a location-intelligence platform for shift work, field service and last-mile
  delivery. Its mobile SDKs (iOS, Android, React Native, Flutter, Expo, Ionic Capacitor and .NET
  MAUI) collect ground-truth location from a worker's device, and its REST API — the HyperTrack API
  at https://v3.api.hypertrack.com — turns that stream into Orders, Workers, Places, Routes, Visits,
  Geotags and Nearby search, plus webhooks for order, route, worker, geofence, outage and trip
  events. Companies use it to verify time and attendance, detect no-call-no-show risk, plan and
  optimise routes, and close out shifts for pay and billing. HyperTrack publishes a machine-readable
  OpenAPI 3.0.3 definition, an llms.txt index, an npm-distributed MCP server, and an open-source
  Agent Skill for coding agents.
