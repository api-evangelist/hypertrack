  legacy_alias:
    field: driver_handle
    superseded_by: worker_handle
    note: >-
      Both fields appear side by side on the same response schemas (Order, RouteDetail, Visit,
      Geotag and every order webhook event). `driver_handle` is the pre-rename name for the same
      value and is still emitted; the contract does not mark it deprecated. An integrator reading
      the spec cold cannot tell which one is authoritative. Same pattern on /nearby/v3 (drivers)
      versus /nearby/v4 (workers).
entities:
- name: Order
  key: order_handle
  schema: Order
  description: A unit of tracked work — a shift, delivery, visit or job.
  states: [started, assigned, arrived, exited, completed, cancelled, disabled, enabled, delayed]
- name: Worker
  key: worker_handle
  schema: Worker
  description: The person doing the work; your app user (driver, courier, technician, rep).
- name: Place
  key: place_handle
  schema: PlaceResponse
  description: A recurring destination — facility, store, site — with a learned or declared geofence.
- name: Route
  key: route_handle
  schema: RouteDetail
  description: An ordered sequence of orders assigned to one worker.
- name: Plan
  key: plan_id
  schema: PlanResponse
  description: A planning run that produces routes from a set of orders.
- name: Visit
  key: visit_id
  schema: Visit
  description: A geofence entry/exit event pair at a place.
- name: Geotag
  key: geotag_id
  schema: Geotag
  description: A proof-of-work marker an app user creates in the field, with metadata and route_to distance.
- name: OpsGroup
  key: ops_group_handle
  schema: OpsGroup
  description: A business division or region; an optional grouping over workers, orders and task definitions.
- name: OrderTask
  key: task_id
  schema: OrderTask
  description: A checklist item on an order, instantiated from a TaskDefinition.
- name: TaskDefinition
  key: task_definition_id
  schema: TasksDefinitionResponse
  description: A reusable task template scoped to an ops group.
- name: WorkerApprover
  key: approver_id
  schema: WorkerApproverResponse
  description: A worker or dashboard user authorised to approve another worker's shift.
- name: Device
  key: device_id
  schema: DriverDevice1
  description: >-
    The phone running the SDK. Not a first-class REST resource — there is no /devices path — but it
    is a first-class node in the graph, referenced from Order, Worker, Visit, Geotag, Route and
    every webhook event, and it IS a first-class resource in the MCP server (list_devices,
    get_device, get_device_history).
- name: Geofence
  key: geofence_id
  description: >-
    The boundary a visit is detected against. Like Device, referenced everywhere but with no REST
    resource of its own; created implicitly by a Place or by an order destination.
- name: EstimatedRoute
  key: estimated_route_id
  schema: GetEstimatedRouteResponse
  description: A generated route estimate carrying the GeoJSON LineString polyline, distance and duration.
- name: ExportJob
  key: job_id
  schema: OrderExportStatusResponse
  description: An async export job for orders or workers.
