core_statement: >-
  HyperTrack tracks WORKERS performing ORDERS at PLACES. Orders are the primary tracking mechanism:
  creating an order starts tracking the assigned worker's device, and completing or cancelling it
  stops tracking.
identifier_scheme:
  caller_supplied:
  - field: order_handle
    entity: Order
    meaning: your shift or job ID
  - field: worker_handle
    entity: Worker
    meaning: your internal user ID
  - field: place_handle
    entity: Place
    meaning: your location ID
  - field: ops_group_handle
    entity: OpsGroup
    meaning: your division or region ID
  - field: route_handle
    entity: Route
    meaning: your route ID
  server_generated:
